name: Run Checks
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Run Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '21.0'
      - name: Install libquil
        env:
          LIBQUIL_VERSION: "0.4.1"
        run: |
          sudo apt-get update && sudo apt-get install -y unzip curl libclang-dev
          curl -fsSL "https://raw.githubusercontent.com/rigetti/libquil/v${LIBQUIL_VERSION}/scripts/install.sh" \
            | sudo -E bash -s -- --install-deps "${LIBQUIL_VERSION}"
      # may protect against linking failure: no space left on device
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-make

      # Knope is used as part of the Python API check.
      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0 # Test before updating, breaking changes likely: https://github.com/knope-dev/action#install-latest-version
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: crates/lib/uv.lock

      - name: Run CI Flow
        env:
          CARGO_MAKE_RUN_CHECK_FORMAT: true
          CARGO_MAKE_RUN_CLIPPY: true
          CARGO_MAKE_BUILD_EXAMPLES: true
        run: |
          cargo make --cwd crates/lib --makefile Makefile.toml ci-flow

  check-python:
    name: Run Python Checks
    runs-on: ubuntu-latest
    steps:
      # Need full history for Knope and Griffe API checks
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '21.0'
      - name: Install libquil
        env:
          LIBQUIL_VERSION: "0.4.1"
        run: |
          sudo apt-get update && sudo apt-get install -y unzip curl libclang-dev
          curl -fsSL "https://raw.githubusercontent.com/rigetti/libquil/v${LIBQUIL_VERSION}/scripts/install.sh" \
            | sudo -E bash -s -- --install-deps "${LIBQUIL_VERSION}"
      # may protect against linking failure: no space left on device
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - uses: taiki-e/install-action@cargo-make

      # Knope is used as part of the Python API check.
      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0 # Test before updating, breaking changes likely: https://github.com/knope-dev/action#install-latest-version

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: crates/lib/uv.lock

      - name: Test Python Package
        run: |
          cargo make --cwd crates/lib --makefile Makefile.toml test-python-package
