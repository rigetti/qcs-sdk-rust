name: Run Checks
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Run Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '21.0'
      - name: Install libquil
        run: |
          sudo ./scripts/install-libquil
      # may protect against linking failure: no space left on device
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@cargo-deny
      - uses: taiki-e/install-action@cargo-make

      # Knope is used as part of the Python API check.
      - uses: knope-dev/action@v2.1.0
        with:
          version: 0.21.3
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: crates/lib/uv.lock

      # Rust builds of this crate link against libpython (the `stubs`/`python` features), so
      # the interpreter and its `LIBDIR` have to be on the environment for every later step —
      # not just the Python ones. `ensure-venv` exports both; publish them job-wide.
      - name: Set up Python virtual environment
        shell: bash
        run: |
          . scripts/ensure-venv
          echo "VIRTUAL_ENV=${VIRTUAL_ENV}" >> "$GITHUB_ENV"
          echo "VENV_PATH=${VENV_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "${VIRTUAL_ENV}/bin" >> "$GITHUB_PATH"

      - name: Run CI Flow
        env:
          CARGO_MAKE_RUN_CHECK_FORMAT: true
          CARGO_MAKE_RUN_CLIPPY: true
          CARGO_MAKE_BUILD_EXAMPLES: true
        run: cargo make --cwd crates/lib --makefile Makefile.toml ci-flow

  check-python:
    name: Run Python Checks
    runs-on: ubuntu-latest
    steps:
      # Need full history for Knope and Griffe API checks
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '21.0'
      - name: Install libquil
        run: |
          sudo ./scripts/install-libquil
      # may protect against linking failure: no space left on device
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - uses: taiki-e/install-action@cargo-make

      # Knope is used as part of the Python API check.
      - uses: knope-dev/action@v2.1.0
        with:
          version: 0.21.3

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: crates/lib/uv.lock

      # Rust builds of this crate link against libpython (the `stubs`/`python` features), so
      # the interpreter and its `LIBDIR` have to be on the environment for every later step —
      # not just the Python ones. `ensure-venv` exports both; publish them job-wide.
      - name: Set up Python virtual environment
        shell: bash
        run: |
          . scripts/ensure-venv
          echo "VIRTUAL_ENV=${VIRTUAL_ENV}" >> "$GITHUB_ENV"
          echo "VENV_PATH=${VENV_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "${VIRTUAL_ENV}/bin" >> "$GITHUB_PATH"

      # Also a dependency of `test-python-package`, but run first so that stale generated
      # files are reported before the longer test run, and as a named step of their own.
      - name: Check Generated Python Files
        run: cargo make --cwd crates/lib --makefile Makefile.toml check-generated-python-files

      - name: Test Python Package
        run: cargo make --cwd crates/lib --makefile Makefile.toml test-python-package
