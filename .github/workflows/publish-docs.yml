name: Publish qcs-sdk-python documentation

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-make
        uses: taiki-e/install-action@cargo-make

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: crates/lib/uv.lock

      # See the note in checks.yml: libpython has to be discoverable for the cargo builds.
      - name: Set up Python virtual environment
        shell: bash
        run: |
          . scripts/ensure-venv
          echo "VIRTUAL_ENV=${VIRTUAL_ENV}" >> "$GITHUB_ENV"
          echo "VENV_PATH=${VENV_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "${VIRTUAL_ENV}/bin" >> "$GITHUB_PATH"

      - name: Build qcs-sdk-python documentation
        run: cargo make --cwd crates/lib document-python-package

      - name: Deploy preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: crates/lib/build/docs
          preview-branch: qcs-sdk-python-docs

      - name: Deploy docs
        if: ${{ github.event_name == 'push' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: crates/lib/build/docs
          publish_branch: qcs-sdk-python-docs

