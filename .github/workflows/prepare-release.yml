name: Prepare Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      type:
        description: Bump versions and trigger a new release.
        type: choice
        required: true
        default: release
        options:
          - release
          - prerelease

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        # Release from the ref this was dispatched on, so a prerelease cut from a
        # branch tags that branch rather than the default one.
        ref: ${{ github.ref }}
        token: ${{ secrets.PAT }}
    - name: Install Knope
      uses: knope-dev/action@v2.1.2
      with:
        # 0.23 tags the ref being released. Older versions created the release
        # against the default branch, so a prerelease cut from a branch produced a
        # tag pointing at main's version, and the publish job then tried to
        # republish that already-released version.
        version: 0.23.0 # Test before updating, breaking changes likely: https://github.com/knope-dev/action#install-latest-version
    - run: |
        git config --global user.name "${{ github.triggering_actor }}"
        git config --global user.email "${{ github.triggering_actor}}@users.noreply.github.com"
    - name: Prepare Prerelease
      run: knope release --verbose --prerelease-label rc
      if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.type == 'prerelease') }}
    - name: Prepare Release
      run: knope release --verbose
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.type == 'release' }}
