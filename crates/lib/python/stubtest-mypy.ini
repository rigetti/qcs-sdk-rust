# `stubtest` type-checks the stubs with `mypy` before comparing them to the runtime, and any
# build error there aborts the run before the allowlist is ever consulted.
#
# `pyo3_stub_gen` refers to types from other crates' nested modules by the module's last
# component (`program.Program`), but imports those modules as `import quil._quil.program`,
# which binds only `quil` — so the references are undefined. See TODO(#556); until the
# generator emits a usable import for foreign modules, silence just that error, in just the
# modules that borrow those types.
[mypy]

[mypy-qcs_sdk._qcs_sdk.client]
disable_error_code = name-defined

[mypy-qcs_sdk._qcs_sdk.compiler.quilc]
disable_error_code = name-defined
